appId: com.telae.desktop
productName: Telae
copyright: Copyright © 2026 Telaê
artifactName: "${productName}-Setup-${version}.${ext}"

# O app confere atualizações no servidor configurado pelo usuário (<servidor>/updates/windows/); este endereço é só o modelo
# do app-update.yml e é substituído em tempo de execução.
publish:
  provider: generic
  url: https://telae.example.invalid/updates/windows/

directories:
  output: dist

files:
  - out/**/*
  - package.json

extraResources:
  - from: build/audio-bridge
    to: audio-bridge
    filter:
      - "**/*"

win:
  icon: public/icon.png
  target:
    - target: nsis
      arch: [x64]
  # Assinatura: definir CSC_LINK (certificado) e CSC_KEY_PASSWORD
  # no ambiente de release. Sem eles o instalador sai unsigned, só para teste.

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  shortcutName: Telae
