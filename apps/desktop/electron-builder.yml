appId: com.telae.desktop
productName: Telae
copyright: Copyright © 2026 Telaê
artifactName: "${productName}-Setup-${version}.${ext}"

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# O servidor de atualizações vem da compilação; mudar a sinalização não o altera.
publish:
  provider: generic
  url: https://telae.example.invalid/updates/windows/

directories:
  output: dist

files:
  - out/**/*
  - package.json

extraResources:
  - from: build/audio-bridge
    to: audio-bridge
    filter:
      - "**/*"

win:
  icon: public/icon.png
  target:
    - target: nsis
      arch: [x64]
  # Assinatura: definir CSC_LINK (certificado) e CSC_KEY_PASSWORD
  # no ambiente de release. Sem assinatura, a atualização é apenas manual.

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  shortcutName: Telae
