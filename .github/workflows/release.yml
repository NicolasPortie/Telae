name: Publicar versão

# Ao enviar uma tag v*, valida, gera o instalador GENÉRICO do Windows (sem servidor embutido) e cria a Release pública.
# Roda só em runners da GitHub. O instalador oficial, com o servidor do mantenedor, a validação física de mídia e a
# entrega ao servidor ficam num repositório de operação privado.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Servidor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/server/Telae.Server.Tests.csproj
      - run: dotnet test tests/server/Telae.Server.Tests.csproj -c Release --no-restore --nologo
      - run: dotnet publish apps/server/Telae.Server.csproj -c Release --no-restore -o "$RUNNER_TEMP/telae-server"
      - run: test -f "$RUNNER_TEMP/telae-server/Telae.Server.dll"

  desktop:
    name: Instalador para Windows
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Instalar dependências
        working-directory: apps/desktop
        run: npm ci

      - name: Conferir a versão da tag
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ('v' + $version -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME não corresponde ao desktop v$version"
          }

      - name: Verificar código, tipos e testes
        working-directory: apps/desktop
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Gerar instalador e manifesto de atualização
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist

      - name: Testar a interface no Electron
        working-directory: apps/desktop
        env:
          TELAE_E2E_MEDIA: "0"
          TELAE_E2E_RELAY: "0"
          Profiles__Path: ${{ runner.temp }}/telae-e2e-profiles.json
        run: npm run test:e2e

      - name: Publicar a versão no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $installer = "apps/desktop/dist/Telae-Setup-$version.exe"
          $files = @($installer, "$installer.blockmap", 'apps/desktop/dist/latest.yml')
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Arquivo ausente: $file" }
          }
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
            $notesFile = "docs/releases/RELEASE_$version.md"
            if (-not (Test-Path -LiteralPath $notesFile)) {
              $notesFile = Join-Path $env:RUNNER_TEMP 'notas-da-versao.md'
              'Instalador genérico para Windows, sem servidor predefinido. Informe o endereço em Servidor > Alterar na tela de entrada. Consulte o README para hospedar o próprio servidor.' | Set-Content -LiteralPath $notesFile -Encoding utf8
            }
            gh release create $env:GITHUB_REF_NAME @files --verify-tag --title "Telaê v$version" --notes-file $notesFile
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar o GitHub Release.' }
