name: Release

# Ao enviar uma tag v*, valida, gera o instalador do Windows e cria a Release pública.
# Roda só em runners da GitHub. Validação física de mídia e a entrega ao servidor
# ficam num repositório de operação privado.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/server/Telae.Server.Tests.csproj
      - run: dotnet test tests/server/Telae.Server.Tests.csproj -c Release --no-restore --nologo
      - run: dotnet publish apps/server/Telae.Server.csproj -c Release --no-restore -o "$RUNNER_TEMP/telae-server"
      - run: test -f "$RUNNER_TEMP/telae-server/Telae.Server.dll"

  desktop:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Verify tag matches desktop version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ('v' + $version -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME não corresponde ao desktop v$version"
          }

      - name: Lint, typecheck and unit tests
        working-directory: apps/desktop
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build Windows installer and update manifest
        working-directory: apps/desktop
        env:
          # Servidor padrão só dos instaladores oficiais; quem compila o código aberto não recebe nenhum.
          TELAE_DEFAULT_SERVER_URL: ${{ vars.TELAE_DEFAULT_SERVER_URL }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist

      - name: Deterministic Electron E2E
        working-directory: apps/desktop
        env:
          TELAE_E2E_MEDIA: "0"
          TELAE_E2E_RELAY: "0"
          Profiles__Path: ${{ runner.temp }}/telae-e2e-profiles.json
        run: npm run test:e2e

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $installer = "apps/desktop/dist/Telae-Setup-$version.exe"
          $files = @($installer, "$installer.blockmap", 'apps/desktop/dist/latest.yml')
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Arquivo ausente: $file" }
          }
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @files --verify-tag --title "Telaê v$version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar o GitHub Release.' }
