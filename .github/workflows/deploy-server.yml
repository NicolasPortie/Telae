name: Validate server release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  media-readiness:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail promptly when physical media runner is unavailable
        shell: pwsh
        env:
          TELAE_MEDIA_RUNNER_READY: ${{ vars.TELAE_MEDIA_RUNNER_READY }}
          GH_TOKEN: ${{ secrets.MEDIA_RUNNER_STATUS_TOKEN }}
        run: ./ops/check-media-runner.ps1

  media:
    needs: media-readiness
    runs-on: [self-hosted, Windows, X64, telae-media]
    timeout-minutes: 30
    concurrency:
      group: telae-physical-media
      cancel-in-progress: false
    env:
      TELAE_E2E_MEDIA: '1'
      TELAE_E2E_RELAY: '0'
      Profiles__Path: ${{ runner.temp }}/telae-release-media-${{ github.run_id }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npm run build:audio-bridge
        working-directory: apps/desktop
      - name: Configure optional test TURN
        if: vars.TELAE_TEST_TURN_URL != ''
        shell: pwsh
        env:
          TEST_TURN_SECRET: ${{ secrets.TELAE_TEST_TURN_SECRET }}
          TEST_TURN_URL: ${{ vars.TELAE_TEST_TURN_URL }}
        run: |
          if (-not $env:TEST_TURN_SECRET) { throw 'TELAE_TEST_TURN_URL exige secret TELAE_TEST_TURN_SECRET.' }
          "Turn__Secret=$env:TEST_TURN_SECRET" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Turn__Urls__0=$env:TEST_TURN_URL" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Headed real capture, playback and live controls
        run: npm run test:e2e
        working-directory: apps/desktop
      - name: Forced relay with real media
        if: vars.TELAE_TEST_TURN_URL != ''
        env:
          TELAE_E2E_RELAY: '1'
        run: npm run test:e2e -- --grep 'relay obrigatório'
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-real-media
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          if-no-files-found: ignore

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/server/Telae.Server.Tests.csproj

      - name: Test server
        run: dotnet test tests/server/Telae.Server.Tests.csproj -c Release --no-restore --nologo

      - name: Publish server
        run: dotnet publish apps/server/Telae.Server.csproj -c Release --no-restore -o "$RUNNER_TEMP/telae-server"

      - name: Verify published server
        run: test -f "$RUNNER_TEMP/telae-server/Telae.Server.dll"

  desktop:
    needs: [validate, media]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Verify tag matches desktop version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ('v' + $version -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME não corresponde ao desktop v$version"
          }

      - name: Lint desktop
        working-directory: apps/desktop
        run: npm run lint

      - name: Test desktop
        working-directory: apps/desktop
        run: npm test

      - name: Typecheck desktop
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build Windows installer and update manifest
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist

      - name: Validate Electron flows before publishing
        working-directory: apps/desktop
        env:
          Profiles__Path: ${{ runner.temp }}/telae-e2e-profiles.json
        run: npm run test:e2e

      - name: Publish private GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $installer = "apps/desktop/dist/Telae-Setup-$version.exe"
          $files = @($installer, "$installer.blockmap", 'apps/desktop/dist/latest.yml')
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Arquivo ausente: $file" }
          }
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @files --verify-tag --title "Telae v$version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar o GitHub Release.' }

  deploy-desktop-update:
    needs: [validate, desktop]
    runs-on: [self-hosted, Linux, X64, telae-updates]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4

      - name: Publish Windows update to Telae server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          release_dir="$(mktemp -d)"
          trap 'rm -rf "$release_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$release_dir" \
            --pattern 'Telae-Setup-*.exe' \
            --pattern 'Telae-Setup-*.exe.blockmap' \
            --pattern 'latest.yml'
          bash ops/publish-desktop-update.sh "$release_dir"
          curl --fail --silent --show-error \
            http://127.0.0.1:5015/updates/windows/latest.yml \
            | grep -Fx "version: ${GITHUB_REF_NAME#v}"

