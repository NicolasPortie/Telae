name: Validate server release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Telae.slnx

      - name: Test server
        run: dotnet test Telae.slnx -c Release --no-restore --nologo

      - name: Publish server
        run: dotnet publish apps/server/Telae.Server.csproj -c Release --no-restore -o "$RUNNER_TEMP/telae-server"

      - name: Archive server artifact
        uses: actions/upload-artifact@v4
        with:
          name: telae-server-${{ github.ref_name }}
          path: ${{ runner.temp }}/telae-server
          if-no-files-found: error
          retention-days: 14

