name: Validate server release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/server/Telae.Server.Tests.csproj

      - name: Test server
        run: dotnet test tests/server/Telae.Server.Tests.csproj -c Release --no-restore --nologo

      - name: Publish server
        run: dotnet publish apps/server/Telae.Server.csproj -c Release --no-restore -o "$RUNNER_TEMP/telae-server"

      - name: Verify published server
        run: test -f "$RUNNER_TEMP/telae-server/Telae.Server.dll"

