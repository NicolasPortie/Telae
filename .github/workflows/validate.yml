name: Validate changes

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TELAE_E2E_MEDIA: '0'
      TELAE_E2E_RELAY: '0'
      Profiles__Path: ${{ github.workspace }}/.telae-validation-profiles.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run lint
        working-directory: apps/desktop
      - run: npm run typecheck
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: dotnet build Telae.slnx -c Release --nologo
      - run: dotnet test tests/server/Telae.Server.Tests.csproj -c Release --no-build --nologo
      - run: npm run build
        working-directory: apps/desktop
      - name: Deterministic Electron E2E
        run: npm run test:e2e
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deterministic-e2e
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          if-no-files-found: ignore
