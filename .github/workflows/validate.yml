name: Validar alterações

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Verificações
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TELAE_E2E_MEDIA: '0'
      TELAE_E2E_RELAY: '0'
      Profiles__Path: ${{ github.workspace }}/.telae-validation-profiles.json
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Preparar o .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Instalar dependências
        run: npm ci
        working-directory: apps/desktop
      - name: Verificar o padrão do código
        run: npm run lint
        working-directory: apps/desktop
      - name: Verificar os tipos
        run: npm run typecheck
        working-directory: apps/desktop
      - name: Executar os testes do aplicativo
        run: npm test
        working-directory: apps/desktop
      - name: Compilar a solução
        run: dotnet build Telae.slnx -c Release --nologo
      - name: Executar os testes do servidor
        run: dotnet test tests/server/Telae.Server.Tests.csproj -c Release --no-build --nologo
      - name: Compilar o aplicativo
        run: npm run build
        working-directory: apps/desktop
      - name: Testes de interface no Electron
        run: npm run test:e2e
        working-directory: apps/desktop
      - name: Guardar os relatórios de teste
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-e2e
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          if-no-files-found: ignore
