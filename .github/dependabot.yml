version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependências]
    groups:
      atualizacoes-compativeis:
        update-types: [minor, patch]
    # Saltos de versão maior (Tailwind 4, Vite 8, Electron...) exigem migração e ficam para decisão manual.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependências]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependências]
